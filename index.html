<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anderson POS System</title>
    <style>
        :root { --primary-color: #023e8a; --item-color: #2a9d8f; --highlight-color: #fca311; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; padding: 15px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .section { display: none; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .section.active { display: block; }
        .nav-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 20px; }
        .nav-btn { padding: 15px 25px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 10px; font-weight: bold; }
        .nav-btn.active { background: var(--primary-color); color: white; }
        input, select { width: 100%; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 1.2em; }
        .autocomplete { position: relative; }
        .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; background: white; max-height: 200px; overflow-y: auto; }
        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #d4d4d4; }
        .autocomplete-items div:hover { background-color: #e9e9e9; }
        /* 其他既有樣式維持不變... */
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; }
        .btn-primary { background-color: var(--primary-color); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🦅 Anderson POS System</h1>
            <div class="nav-tabs">
                <button class="nav-btn active" onclick="showSection('payment')">💻 Cashier POS</button>
                <button class="nav-btn" onclick="showSection('records')">📊 Reports</button>
                <button class="nav-btn" onclick="showSection('students')">👨‍🎓 Student List</button>
                <button class="nav-btn" onclick="showSection('fees')">⚙️ Admin</button>
            </div>
        </header>

        <div id="payment" class="section active">
            <label>Student Details (Start typing name):</label>
            <div class="name-row">
                <div class="form-group autocomplete">
                    <input type="text" id="payLastName" placeholder="Last Name" oninput="liveSearch(this.value, 'last')">
                    <div id="lastList" class="autocomplete-items"></div>
                </div>
                <div class="form-group autocomplete">
                    <input type="text" id="payFirstName" placeholder="First Name" oninput="liveSearch(this.value, 'first')">
                    <div id="firstList" class="autocomplete-items"></div>
                </div>
            </div>
            </div>
    </div>

<script>
    // 關鍵：Live Search 功能回歸
    function liveSearch(val, type) {
        const list = document.getElementById(type === 'last' ? 'lastList' : 'firstList');
        list.innerHTML = '';
        if (!val) return;
        const matches = students.filter(s => (type === 'last' ? s.lastName : s.firstName).toLowerCase().startsWith(val.toLowerCase()));
        matches.forEach(s => {
            let div = document.createElement('div');
            div.innerHTML = `${s.lastName}, ${s.firstName} (Div: ${s.division})`;
            div.onclick = () => {
                document.getElementById('payLastName').value = s.lastName;
                document.getElementById('payFirstName').value = s.firstName;
                selectedDivision = s.division;
                document.querySelectorAll('.division-circle').forEach(el => {
                    el.classList.toggle('selected', el.textContent === s.division);
                });
                document.getElementById('invoiceDivDisplay').textContent = `Div: ${s.division}`;
                list.innerHTML = '';
            };
            list.appendChild(div);
        });
    }

    // 其餘 v14.0 功能保持完全一致...
</script>
</body>
</html>
